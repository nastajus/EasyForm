<svg xmlns="http://www.w3.org/2000/svg" width="960" height="377" viewBox="0 0 960 377" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">Why filtering changed record identity</title>
<desc id="desc">Solid arrows map visible positions to rows 2 and 4. A dashed arrow shows how position plus one incorrectly targets row 3.</desc>
<rect x="0" y="0" width="960" height="377" rx="20" fill="#101827" stroke="#101827"/>
<text x="30" y="44" fill="#f1f5fc" font-size="28" font-weight="700">Why filtering changed record identity</text>
<text x="30" y="87" fill="#b8c9dd" font-size="17" font-weight="700">Visible record position</text><text x="552" y="87" fill="#b8c9dd" font-size="17" font-weight="700">Physical worksheet row</text><rect x="30" y="113" width="310" height="57" rx="10" fill="#192638" stroke="#394c64"/><rect x="30" y="257" width="310" height="57" rx="10" fill="#192638" stroke="#394c64"/><text x="47" y="148" fill="#f1f5fc" font-size="19" font-weight="600">1   R-001</text><text x="47" y="292" fill="#f1f5fc" font-size="19" font-weight="600">2   R-003</text><rect x="552" y="113" width="378" height="57" rx="10" fill="#192638" stroke="#394c64"/><text x="570" y="148" fill="#f1f5fc" font-size="19" font-weight="600">Row 2   R-001</text><rect x="552" y="185" width="378" height="57" rx="10" fill="#101827" stroke="#ffcb87"/><text x="570" y="220" fill="#ffcb87" font-size="19" font-weight="600">Row 3   R-002   Hidden</text><rect x="552" y="257" width="378" height="57" rx="10" fill="#192638" stroke="#394c64"/><text x="570" y="292" fill="#f1f5fc" font-size="19" font-weight="600">Row 4   R-003</text><path d="M360 141H534m-8 -6l8 6-8 6" stroke="#79dfef" stroke-width="2" fill="none"/><path d="M360 285H534m-8 -6l8 6-8 6" stroke="#79dfef" stroke-width="2" fill="none"/><path d="M360 277Q450 213 534 213m-8 -6l8 6-8 6" fill="none" stroke="#ffcb87" stroke-width="2" stroke-dasharray="6 5"/><text x="30" y="351" fill="#b8c9dd" font-size="17" font-weight="400">Visible record 2 resolves to row 4. The old position + 1 calculation points to hidden row 3.</text>
</svg>
